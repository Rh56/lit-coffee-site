<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootwork</title>
<meta name="description" content="A living map of the people you know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="network.css">
<link rel="stylesheet" href="archive.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rootwork">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
</head>
<body>
<!--APP-->
<div class="shell">

  <header class="topbar">
    <div class="wordmark">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22V10M12 10c0-3 2.6-4.6 5.4-4.8M12 10C12 7 9.4 5.4 6.6 5.2M12 15c0-2.2 2-3.2 4-3.4"/>
        <circle cx="12" cy="22" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="17.8" cy="5" r="1.6"/><circle cx="6.2" cy="5" r="1.6"/><circle cx="16.4" cy="11.4" r="1.3"/>
      </svg>
      <span>Rootwork</span>
      <span class="sub">network map</span>
    </div>

    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search" type="search" placeholder="Find a person…" autocomplete="off" aria-label="Find a person">
      <div class="results" id="results" role="listbox"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tools">
      <button class="btn icon" id="btn-type" title="Typeface" aria-label="Choose a typeface"><span class="aa">Aa</span></button>
      <button class="btn icon files" id="btn-archive" title="The archive (A)" aria-label="Open the archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-2.5H5a2 2 0 0 0-2 2z"/><path d="M3 11h18"/></svg>
      </button>
      <button class="btn" id="btn-add">Add person</button>
      <button class="btn icon" id="btn-newcircle" title="New circle" aria-label="New circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="5"/><path d="M17 4v7M13.5 7.5h7"/></svg>
      </button>
      <button class="btn" id="btn-import">Import</button>
      <button class="btn" id="btn-export">Export</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="plate"></canvas>

    <div class="stage-hint" id="hint">
      <h2>Nothing has sprouted yet.</h2>
      <p><b>Add person</b> starts one. <b>Import</b> takes your spreadsheet — or just drop the file anywhere on this page. Everything after that is edited on the person’s card: click any value to change it, <em>+ log a touchpoint</em> to record what happened.</p>
    </div>

    <div class="layouts" id="layouts" role="group" aria-label="Layout"></div>

    <div class="viewtools">
      <button class="btn icon" id="btn-tidy" title="Tidy — settle the map again (T)" aria-label="Tidy the map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M8.5 9h7l1.5 5.5a5 5 0 0 1-10 0z"/><path d="M9.5 20h5"/></svg>
      </button>
      <button class="btn icon" id="btn-fit" title="Fit to view (F)" aria-label="Fit to view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="rail">
      <div class="card hiddenbar" id="hiddenbar" hidden>
        <h3>Hidden <span class="count" id="hidden-count"></span></h3>
        <div class="legend-list" id="hiddenlist"></div>
      </div>
    </div>


    <section class="card pad" id="pad" aria-label="Notes">
      <h3>
        <span>Notes</span>
        <span class="count" id="pad-count"></span>
        <button class="mini" id="pad-toggle" title="Show or hide the notes" aria-label="Show or hide the notes" aria-expanded="true">–</button>
      </h3>
      <div class="pad-body" id="pad-body">
        <div class="pad-list" id="pad-list"></div>
        <textarea id="pad-input" rows="2" placeholder="Jot anything — ↵ to keep" aria-label="Write a note"></textarea>
      </div>
    </section>

    <aside class="dossier" id="dossier" aria-label="Person details" aria-hidden="true"></aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>
<!--/APP-->
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="archive.js"></script>
</body>
</html>
