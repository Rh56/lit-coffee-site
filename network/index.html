<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootwork</title>
<meta name="description" content="A living map of the people you know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="network.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e6e2d7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rootwork">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
</head>
<body>
<!--APP-->
<div class="shell">

  <header class="topbar">
    <div class="wordmark">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M12 22V10M12 10c0-3 2.6-4.6 5.4-4.8M12 10C12 7 9.4 5.4 6.6 5.2M12 15c0-2.2 2-3.2 4-3.4"/>
        <circle cx="12" cy="22" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="17.8" cy="5" r="1.6"/><circle cx="6.2" cy="5" r="1.6"/><circle cx="16.4" cy="11.4" r="1.3"/>
      </svg>
      <span>Rootwork</span>
      <span class="sub">network map</span>
    </div>

    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search" type="search" placeholder="Find a person…" autocomplete="off" aria-label="Find a person">
      <div class="results" id="results" role="listbox"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tools">
      <button class="btn" id="btn-add">Add person</button>
      <button class="btn icon" id="btn-newcircle" title="New circle" aria-label="New circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="14" r="5"/><path d="M17 4v7M13.5 7.5h7"/></svg>
      </button>
      <button class="btn" id="btn-import">Import</button>
      <button class="btn" id="btn-export">Export</button>
      <button class="btn icon" id="btn-help" title="How to talk to it" aria-label="Help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.8.7-.8 1.3v.4"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="plate"></canvas>

    <div class="stage-hint" id="hint">
      <h2>Nothing has sprouted yet.</h2>
      <p>Tell the bar below what happened, in your own words — “Had a zoom with Dana Okafor, she’s a data scientist at Merck, went to Rutgers, dana@…”. Or import the spreadsheet you already keep.</p>
    </div>

    <div class="viewtools">
      <button class="btn icon" id="btn-fit" title="Fit to view" aria-label="Fit to view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="btn icon" id="btn-theme" title="Switch theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>

    <div class="rail">
      <div class="card" id="nudge-card">
        <h3>Going cold <span class="count" id="nudge-count"></span></h3>
        <div class="nudge-list" id="nudges"></div>
      </div>
      <div class="card hiddenbar" id="hiddenbar" hidden>
        <h3>Hidden <span class="count" id="hidden-count"></span></h3>
        <div class="legend-list" id="hiddenlist"></div>
      </div>
    </div>

    <div class="dock">
      <div id="preview-slot"></div>
      <form class="chatbar" id="chatform">
        <span class="prompt" aria-hidden="true">&rsaquo;</span>
        <textarea id="chat" rows="1" placeholder="Zoom with Dana Okafor — data scientist at Merck, Rutgers grad, dana@merck.com, wants to talk about the pilot in two weeks" aria-label="Log something that happened"></textarea>
        <button class="send" type="submit">Log</button>
      </form>
    </div>

    <aside class="dossier" id="dossier" aria-label="Person details" aria-hidden="true"></aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>
<!--/APP-->
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
