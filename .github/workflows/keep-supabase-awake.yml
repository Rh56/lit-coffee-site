# Free Supabase projects are paused after about a week of low activity. This
# pings the project every three days so it stays awake even if Rootwork is not
# opened. It reads two repository secrets and prints only the status code —
# never the URL, the key, or the row — because logs on a public repo are public.
#
# One-time setup: repo Settings -> Secrets and variables -> Actions -> New
# repository secret, twice:
#   SUPABASE_URL               https://xxxxxxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY   the publishable (anon) key, never the secret one
#
# Note: GitHub switches off scheduled workflows in a repository with no
# activity for 60 days. It emails first, and any push turns them back on.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'      # 09:17 UTC, every third day
  workflow_dispatch:            # and whenever you press the button

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -u
          missing=""
          [ -z "${SUPABASE_URL}" ] && missing="SUPABASE_URL"
          [ -z "${SUPABASE_PUBLISHABLE_KEY}" ] && missing="${missing:+$missing and }SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Secrets missing::This job cannot reach Supabase until ${missing} is set."
            echo ""
            echo "  Nothing is broken in the workflow — it is waiting on two values."
            echo ""
            echo "  1. Open https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo "  2. New repository secret, twice:"
            echo "       SUPABASE_URL              https://xxxxxxxx.supabase.co"
            echo "       SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key, NOT the secret one"
            echo "     Both are in Supabase: Project Settings -> API Keys."
            echo "  3. Actions -> Keep Supabase awake -> Run workflow, to check it straight away."
            echo ""
            exit 1
          fi

          base="${SUPABASE_URL%/}"
          code=0

          # A paused project can take a moment to answer, so give it three goes.
          for attempt in 1 2 3; do
            code=$(curl -sS -m 45 -o /dev/null -w '%{http_code}' \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              "${base}/rest/v1/rootwork?select=id&limit=0" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            case "${code}" in
              200|206) echo "Project is awake."; exit 0 ;;
            esac
            sleep 20
          done

          echo "No healthy response after three attempts (last status ${code})."
          echo "If this keeps failing, check the project in the Supabase dashboard."
          exit 1
